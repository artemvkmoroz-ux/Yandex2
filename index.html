<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROOTTREE — Ищи глубже</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root {
  --bg: #f4f7f5;
  --bg-card: #ffffff;
  --bg-glass: rgba(255,255,255,0.7);
  --text: #0d1f17;
  --text-2: #4a6157;
  --text-3: #8ca196;
  --border: rgba(13,31,23,0.08);
  --border-2: rgba(13,31,23,0.15);
  --accent: #00a86b; /* Изумрудный / Дерево */
  --accent-2: #007a4d;
  --accent-3: #f59e0b; /* Золотой */
  --glow: rgba(0,168,107,0.3);
  --link: #007a4d;
  --mark: #fef08a;
  --shadow: 0 16px 48px -8px rgba(13,31,23,0.12);
  --shadow-lg: 0 32px 80px -16px rgba(13,31,23,0.2);
  --r: 20px;
}
[data-theme="dark"] {
  --bg: #08110c;
  --bg-card: #0f1a14;
  --bg-glass: rgba(15,26,20,0.65);
  --text: #e6f0ea;
  --text-2: #9db8a9;
  --text-3: #5f7d6c;
  --border: rgba(230,240,234,0.08);
  --border-2: rgba(230,240,234,0.15);
  --accent: #00d68f;
  --accent-2: #00a86b;
  --accent-3: #fbbf24;
  --glow: rgba(0,214,143,0.25);
  --link: #4ade80;
  --mark: #fbbf24;
  --shadow: 0 16px 48px -8px rgba(0,0,0,0.6);
  --shadow-lg: 0 32px 80px -16px rgba(0,0,0,0.8);
}

/* ============ БАЗА ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
  -webkit-font-smoothing: antialiased;
}

/* ============ ФОН ============ */
.aurora {
  position: fixed; inset: -20%; z-index: -2; pointer-events: none;
  filter: blur(90px); opacity: .85;
  background:
    radial-gradient(40% 40% at 15% 20%, var(--glow), transparent 70%),
    radial-gradient(35% 45% at 85% 15%, rgba(0,214,143,.15), transparent 70%),
    radial-gradient(45% 40% at 50% 90%, rgba(251,191,36,.1), transparent 70%);
  animation: auroraMove 22s ease-in-out infinite alternate;
}
@keyframes auroraMove {
  0% { transform: translate(0,0) scale(1); }
  100% { transform: translate(-4%,3%) scale(1.08); }
}

/* ============ КОНТЕЙНЕР ============ */
.app {
  position: relative; z-index: 1;
  max-width: 1040px; margin: 0 auto; padding: 24px 24px 0;
  display: flex; flex-direction: column; min-height: 100vh;
}

/* ============ TOPBAR ============ */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 4px; margin-bottom: 36px;
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
.logo-svg { width: 46px; height: 46px; filter: drop-shadow(0 8px 24px var(--glow)); transition: transform .4s; }
.brand:hover .logo-svg { transform: scale(1.08); }
.logo-text {
  font-size: 24px; font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(120deg, var(--text) 20%, var(--accent) 80%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.top-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px;
  border: 1px solid var(--border-2); background: var(--bg-glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--text); cursor: pointer; display: grid; place-items: center;
  font-size: 18px; transition: .2s; box-shadow: var(--shadow);
}
.icon-btn:hover { transform: translateY(-2px); border-color: var(--accent); }

/* ============ HERO ============ */
.hero {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; transition: all .5s; margin-top: 6vh;
}
.hero.compact { margin-top: 0; margin-bottom: 8px; }
.hero-title {
  font-size: clamp(36px, 6vw, 58px); font-weight: 900; letter-spacing: -2px;
  line-height: 1.05; margin-bottom: 12px;
  background: linear-gradient(140deg, var(--text) 30%, var(--accent) 70%, var(--accent-3) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: titleIn .7s backwards;
}
.hero-title .accent { -webkit-text-fill-color: var(--accent); }
@keyframes titleIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.tagline { color: var(--text-2); font-size: 16px; margin-bottom: 32px; animation: titleIn .7s .1s backwards; }

/* ============ ПОИСК ============ */
.search-wrap { position: relative; width: 100%; max-width: 660px; animation: titleIn .7s .2s backwards; }
.search-box {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 6px 6px 20px;
  background: var(--bg-glass);
  backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  border: 1.5px solid var(--border-2);
  border-radius: 999px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
  transition: .3s;
}
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow), var(--shadow-lg); transform: translateY(-1px); }
.search-icon { font-size: 18px; color: var(--text-3); flex-shrink: 0; }
.search-box input {
  flex: 1; padding: 14px 10px; border: none; background: transparent;
  font-size: 16px; font-weight: 500; color: var(--text); outline: none; min-width: 0; font-family: inherit;
}
.search-box input::placeholder { color: var(--text-3); font-weight: 400; }
.search-btn {
  padding: 12px 26px; border: none; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: inherit; white-space: nowrap; box-shadow: 0 8px 24px var(--glow);
  transition: .2s;
}
.search-btn:hover { transform: translateY(-1px) scale(1.02); filter: brightness(1.1); }

/* ============ СТАТИСТИКА ============ */
.stats {
  margin-top: 22px; color: var(--text-3); font-size: 13px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
}
.stats .pill {
  padding: 5px 12px; border-radius: 999px; background: var(--bg-glass);
  border: 1px solid var(--border); font-size: 12.5px; font-weight: 500;
}
.stats .pill b { color: var(--accent); font-weight: 800; }

/* ============ РЕЗУЛЬТАТЫ ============ */
.results {
  width: 100%; max-width: 780px; margin: 24px auto 0;
  display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px;
}
.result {
  padding: 20px 24px; border-radius: var(--r);
  background: var(--bg-glass);
  backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: .3s; animation: cardIn .45s backwards; position: relative; overflow: hidden;
}
.result::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-3));
  transform: scaleX(0); transform-origin: left; transition: transform .4s;
}
.result:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.result:hover::before { transform: scaleX(1); }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.result a {
  color: var(--link); text-decoration: none;
  font-size: 18px; font-weight: 700; line-height: 1.35; letter-spacing: -.2px; transition: .2s;
}
.result a:hover { color: var(--accent); }
.result .meta { display: flex; align-items: center; gap: 10px; margin: 8px 0 10px; flex-wrap: wrap; }
.result .url {
  color: var(--accent-2); font-size: 12px; font-weight: 500;
  padding: 3px 10px; border-radius: 8px;
  background: rgba(0,168,107,.1); border: 1px solid rgba(0,168,107,.2);
}
.result .badge {
  font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  padding: 3px 10px; border-radius: 8px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--text-2);
}
.result .snippet { color: var(--text-2); font-size: 14px; line-height: 1.6; }
mark { background: linear-gradient(120deg, var(--mark), #ffd84d); color: #3a2c00; padding: 1px 4px; border-radius: 4px; font-weight: 700; }

/* ============ МОДАЛЬНОЕ ОКНО НАСТРОЕК ============ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: .3s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 480px;
  background: var(--bg-card); border: 1px solid var(--border-2);
  border-radius: 24px; padding: 24px;
  box-shadow: var(--shadow-lg); transform: translateY(20px) scale(.96);
  transition: .3s cubic-bezier(.34,1.4,.64,1);
  max-height: 90vh; overflow-y: auto;
}
.modal-overlay.show .modal { transform: none; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 20px; font-weight: 800; }
.close-btn { background: transparent; border: none; font-size: 20px; color: var(--text-3); cursor: pointer; }
.close-btn:hover { color: var(--accent); }

.setting-group { margin-bottom: 24px; }
.setting-group h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); margin-bottom: 12px; }
.setting-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.setting-item:last-child { border-bottom: none; }
.setting-text { display: flex; flex-direction: column; gap: 4px; }
.setting-text b { font-size: 14px; font-weight: 600; }
.setting-text span { font-size: 12px; color: var(--text-2); }

/* Переключатель (Toggle) */
.toggle {
  width: 44px; height: 24px; border-radius: 999px; background: var(--border-2);
  position: relative; cursor: pointer; transition: .3s; border: none; outline: none;
}
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  background: #fff; border-radius: 50%; transition: .3s;
}
.toggle.active { background: var(--accent); }
.toggle.active::after { transform: translateX(20px); }

.btn-danger {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,59,100,.2);
  background: rgba(255,59,100,.1); color: #ff2d55; font-weight: 700; font-size: 14px;
  cursor: pointer; transition: .2s; margin-top: 12px; font-family: inherit;
}
.btn-danger:hover { background: rgba(255,59,100,.2); }

/* История в настройках */
.history-list { max-height: 150px; overflow-y: auto; border: 1px solid var(--border-2); border-radius: 12px; padding: 8px; }
.history-item-modal { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; }
.history-item-modal:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="aurora"></div>

<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand" onclick="resetSearch()">
      <!-- Дерево/Росток SVG -->
      <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="treeGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#00a86b"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <!-- Ствол -->
        <path d="M50 90 Q50 60 30 40 M50 90 Q50 50 70 30" fill="none" stroke="url(#treeGrad)" stroke-width="8" stroke-linecap="round"/>
        <!-- Листья -->
        <circle cx="30" cy="40" r="12" fill="url(#treeGrad)"/>
        <circle cx="70" cy="30" r="10" fill="url(#treeGrad)"/>
        <circle cx="50" cy="20" r="14" fill="url(#treeGrad)"/>
      </svg>
      <div class="logo-text">GROOTTREE</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
      <button class="icon-btn" id="themeToggle" title="Тема">🌙</button>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero" id="hero">
    <h1 class="hero-title">Расти <span class="accent">знаниями.</span><br>Ищи глубже.</h1>
    <div class="tagline">Умный поиск по открытому интернету</div>

    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="q" placeholder="Что хотите найти?" autofocus autocomplete="off">
        <button class="search-btn" onclick="realSearch()">Найти</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>
  </div>

  <!-- РЕЗУЛЬТАТЫ -->
  <div class="results" id="results"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Настройки GROOTTREE</div>
      <button class="close-btn" onclick="toggleSettings(false)">✕</button>
    </div>

    <div class="setting-group">
      <h4>Источники поиска</h4>
      <div class="setting-item">
        <div class="setting-text">
          <b>Wikipedia</b>
          <span>Поиск по статьям</span>
        </div>
        <button class="toggle active" id="toggleWiki" onclick="toggleSource('wiki', this)"></button>
      </div>
      <div class="setting-item">
        <div class="setting-text">
          <b>DuckDuckGo</b>
          <span>Результаты по всему интернету</span>
        </div>
        <button class="toggle active" id="toggleDdg" onclick="toggleSource('ddg', this)"></button>
      </div>
    </div>

    <div class="setting-group">
      <h4>Приватность</h4>
      <div class="setting-item">
        <div class="setting-text">
          <b>История поиска</b>
          <span id="historyCount">0 запросов сохранено</span>
        </div>
        <button class="toggle active" id="toggleHistory" onclick="toggleHistorySetting(this)"></button>
      </div>
      
      <div class="history-list" id="historyListModal" style="margin-top:10px;">
        <!-- Сюда рендерится история -->
      </div>
      
      <button class="btn-danger" onclick="clearHistory()">Очистить историю поиска</button>
    </div>
  </div>
</div>

<div class="footer" style="margin-top:auto; padding: 36px 0 24px; text-align: center; color: var(--text-3); font-size: 13px;">
  <b>GROOTTREE</b> © 2026 · Ищи глубже
</div>

<script>
/* ============================================================
   СОСТОЯНИЕ И НАСТРОЙКИ
   ============================================================ */
const state = {
  sources: { wiki: true, ddg: true },
  saveHistory: true,
  history: JSON.parse(localStorage.getItem('groot-history') || '[]')
};

// Восстановление настроек
const savedSettings = JSON.parse(localStorage.getItem('groot-settings') || '{}');
if (savedSettings.sources) state.sources = savedSettings.sources;
if (typeof savedSettings.saveHistory !== 'undefined') state.saveHistory = savedSettings.saveHistory;

/* ============================================================
   UI ЭЛЕМЕНТЫ
   ============================================================ */
const resultsDiv = document.getElementById('results');
const statsDiv = document.getElementById('stats');
const heroEl = document.getElementById('hero');
const modal = document.getElementById('settingsModal');

/* ============================================================
   НАСТРОЙКИ UI
   ============================================================ */
function toggleSettings(show) {
  modal.classList.toggle('show', show);
  if (show) renderHistoryModal();
}

document.getElementById('settingsBtn').onclick = () => toggleSettings(true);
modal.onclick = (e) => { if (e.target === modal) toggleSettings(false); };

function toggleSource(source, btn) {
  state.sources[source] = !state.sources[source];
  btn.classList.toggle('active', state.sources[source]);
  localStorage.setItem('groot-settings', JSON.stringify(state));
}

function toggleHistorySetting(btn) {
  state.saveHistory = !state.saveHistory;
  btn.classList.toggle('active', state.saveHistory);
  localStorage.setItem('groot-settings', JSON.stringify(state));
  if (!state.saveHistory) clearHistory();
}

function renderHistoryModal() {
  const list = document.getElementById('historyListModal');
  document.getElementById('historyCount').textContent = `${state.history.length} запросов сохранено`;
  if (!state.history.length) {
    list.innerHTML = '<div style="padding:10px;font-size:12px;text-align:center;color:var(--text-3)">История пуста</div>';
    return;
  }
  list.innerHTML = state.history.slice(0, 10).map(h => `
    <div class="history-item-modal">
      <span>${escapeHtml(h)}</span>
    </div>
  `).join('');
}

function clearHistory() {
  state.history = [];
  localStorage.removeItem('groot-history');
  renderHistoryModal();
}

/* Инициализация переключателей */
document.getElementById('toggleWiki').classList.toggle('active', state.sources.wiki);
document.getElementById('toggleDdg').classList.toggle('active', state.sources.ddg);
document.getElementById('toggleHistory').classList.toggle('active', state.saveHistory);

/* ============================================================
   ПОИСК
   ============================================================ */
async function searchWikipedia(query) {
  const url = `https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=5`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    return (data.query?.search || []).map(item => ({
      title: item.title,
      snippet: item.snippet.replace(/<[^>]*>/g, ''),
      url: `https://ru.wikipedia.org/wiki/${encodeURIComponent(item.title)}`,
      source: 'Wikipedia',
      sourceClass: 'wiki'
    }));
  } catch (e) { return []; }
}

function searchDuckDuckGo(query) {
  return new Promise((resolve) => {
    const cbName = 'ddg_' + Date.now() + Math.random().toString(36).slice(2);
    const timeout = setTimeout(() => { cleanup(); resolve([]); }, 6000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      const s = document.getElementById(cbName);
      if (s) s.remove();
    }
    window[cbName] = function(data) {
      cleanup();
      const results = [];
      if (data.AbstractText) {
        results.push({
          title: data.Heading || query,
          snippet: data.AbstractText,
          url: data.AbstractURL || `https://duckduckgo.com/?q=${encodeURIComponent(query)}`,
          source: 'DuckDuckGo',
          sourceClass: 'ddg'
        });
      }
      if (data.RelatedTopics) {
        data.RelatedTopics.slice(0, 5).forEach(t => {
          if (t.Text && t.FirstURL) {
            results.push({
              title: t.Text.split(' - ')[0] || t.Text.slice(0, 60),
              snippet: t.Text.slice(0, 150),
              url: t.FirstURL,
              source: 'DuckDuckGo',
              sourceClass: 'ddg'
            });
          }
        });
      }
      if (!results.length) {
        results.push({
          title: `Искать «${query}» в DuckDuckGo`,
          snippet: 'Нажмите, чтобы открыть полные результаты поиска.',
          url: `https://duckduckgo.com/?q=${encodeURIComponent(query)}`,
          source: 'DuckDuckGo',
          sourceClass: 'ddg'
        });
      }
      resolve(results);
    };
    const script = document.createElement('script');
    script.id = cbName;
    script.src = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&callback=${cbName}`;
    script.onerror = () => { cleanup(); resolve([]); };
    document.body.appendChild(script);
  });
}

async function realSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  heroEl.classList.add('compact');
  statsDiv.innerHTML = '';
  
  // Сохранение в историю
  if (state.saveHistory) {
    state.history = [q, ...state.history.filter(x => x !== q)].slice(0, 20);
    localStorage.setItem('groot-history', JSON.stringify(state.history));
  }

  // Скелетоны
  resultsDiv.innerHTML = Array(3).fill(0).map(() => `
    <div class="skeleton">
      <div class="sk-line title"></div>
      <div class="sk-line meta"></div>
      <div class="sk-line desc"></div>
    </div>
  `).join('');

  const t0 = performance.now();
  const promises = [];
  if (state.sources.wiki) promises.push(searchWikipedia(q));
  if (state.sources.ddg) promises.push(searchDuckDuckGo(q));
  
  const resultArrays = await Promise.all(promises);
  const all = resultArrays.flat();
  const t1 = performance.now();

  if (!all.length) {
    resultsDiv.innerHTML = `<div class="empty"><span class="big">🌱</span><h3>Ничего не найдено</h3><p>По запросу «${escapeHtml(q)}» пусто.</p></div>`;
    return;
  }

  statsDiv.innerHTML = `
    <span class="pill">Найдено <b>${all.length}</b></span>
    <span class="pill">⏱ ${(t1 - t0).toFixed(0)} мс</span>
  `;

  resultsDiv.innerHTML = all.map((r, i) => `
    <div class="result" style="animation-delay:${i * 40}ms">
      <a href="${r.url}" target="_blank" rel="noopener">${highlight(r.title, q)}</a>
      <div class="meta">
        <span class="url">${hostOf(r.url)}</span>
        <span class="badge ${r.sourceClass}">${r.source}</span>
      </div>
      <div class="snippet">${highlight(r.snippet, q)}</div>
    </div>
  `).join('');
}

/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
function hostOf(url) {
  try { return new URL(url).hostname.replace('www.', ''); }
  catch { return url.slice(0, 40); }
}
function highlight(text, q) {
  const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  let out = escapeHtml(text);
  words.forEach(w => {
    const re = new RegExp(`(${escapeRegex(w)}[а-яёa-z]*)`, 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ============================================================
   ТЕМА И СБРОС
   ============================================================ */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('groot-theme', t);
}
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
applyTheme(localStorage.getItem('groot-theme') || 'light');

function resetSearch() {
  document.getElementById('q').value = '';
  resultsDiv.innerHTML = '';
  statsDiv.innerHTML = '';
  heroEl.classList.remove('compact');
  document.getElementById('q').focus();
}

document.getElementById('q').addEventListener('keypress', e => {
  if (e.key === 'Enter') realSearch();
});
